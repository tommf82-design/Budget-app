<script>
// Show a readable message instead of staying stuck if something fails to load or run.
window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && root.innerHTML.indexOf("Chargement") !== -1) {
    var msg = (e && (e.message || (e.error && e.error.message))) || "Erreur inconnue";
    root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#A6403A;white-space:pre-wrap;line-height:1.5;">Erreur au chargement :\n' + msg + '\n\nSource : ' + (e.filename || "?") + " (ligne " + (e.lineno || "?") + ")</div>";
  }
}, true);
setTimeout(function () {
  var root = document.getElementById("root");
  if (root && root.innerHTML.indexOf("Chargement") !== -1) {
    root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#22281F;line-height:1.6;">L\'application met trop de temps à démarrer.<br><br>Vérifie ta connexion internet (le premier chargement a besoin d\'internet pour récupérer React et les polices), puis recharge la page.<br><br>Si ça persiste, ton réseau bloque peut-être unpkg.com — essaie avec un autre réseau (WiFi ↔ 4G/5G) pour vérifier.</div>';
  }
}, 9000);

// localStorage-backed shim matching the same async key/value API used by the app.
window.storage = {
  async get(key) {
    var v = localStorage.getItem("carnet:" + key);
    return v === null ? null : { key: key, value: v };
  },
  async set(key, value) {
    localStorage.setItem("carnet:" + key, value);
    return { key: key, value: value };
  },
  async delete(key) {
    localStorage.removeItem("carnet:" + key);
    return { key: key, deleted: true };
  },
  async list(prefix) {
    var p = "carnet:" + (prefix || "");
    var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; }).map(function (k) { return k.slice(7); });
    return { keys: keys };
  }
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}
</script>

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function arcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const so = polarToCartesian(cx, cy, rOuter, endAngle);
  const eo = polarToCartesian(cx, cy, rOuter, startAngle);
  const si = polarToCartesian(cx, cy, rInner, endAngle);
  const ei = polarToCartesian(cx, cy, rInner, startAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return ["M", so.x, so.y, "A", rOuter, rOuter, 0, largeArc, 0, eo.x, eo.y, "L", ei.x, ei.y, "A", rInner, rInner, 0, largeArc, 1, si.x, si.y, "Z"].join(" ");
}
function SimplePie({ data, size = 120 }) {
  const total = data.reduce((s, d) => s + d.total, 0);
  if (total <= 0) return null;
  let angle = 0;
  const cx = size / 2, cy = size / 2, rOuter = size / 2 - 4, rInner = rOuter * 0.58;
  const slices = data.map((d) => {
    const sweep = (d.total / total) * 359.99;
    const start = angle, end = angle + sweep;
    angle = end;
    return { id: d.id, color: d.color, path: arcPath(cx, cy, rOuter, rInner, start, end) };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s) => <path key={s.id} d={s.path} fill={s.color} stroke="var(--surface)" strokeWidth="2" />)}
    </svg>
  );
}
function SimpleBarChart({ data, series, height = 170 }) {
  const max = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
  const plotHeight = height - 22;
  return (
    <div>
      {series.length > 1 && (
        <div className="chart-legend">
          {series.map((s) => <div className="chart-legend-item" key={s.key}><span className="dot" style={{ background: s.color }} />{s.key}</div>)}
        </div>
      )}
      <div className="bar-chart" style={{ height }}>
        {data.map((d, i) => (
          <div className="bar-chart-col" key={i}>
            <div className="bar-chart-bars" style={{ height: plotHeight }}>
              {series.map((s) => {
                const v = d[s.key] || 0;
                const h = max > 0 ? (v / max) * plotHeight : 0;
                return <div key={s.key} style={{ width: 10, height: Math.max(v > 0 ? 2 : 0, h), background: s.color, borderRadius: "3px 3px 0 0", alignSelf: "flex-end" }} />;
              })}
            </div>
            <div className="bar-chart-label">{d.name}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function monthLabel(key) { const [y, m] = key.split("-").map(Number); return `${MONTH_NAMES[m - 1]} ${y}`; }

function todayISO() { return new Date().toISOString().slice(0, 10); }

function b64EncodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str) { return decodeURIComponent(escape(atob(str))); }
async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function ghApiUrl(gh) {
  const [owner, repo] = (gh.repo || "").split("/").map((s) => s.trim());
  if (!owner || !repo) throw new Error("Dépôt invalide (attendu utilisateur/depot)");
  return `https://api.github.com/repos/${owner}/${repo}/contents/${gh.path}`;
}
async function ghGetFile(gh) {
  if (!gh.token) throw new Error("Ajoute ton token d'accès personnel");
  const res = await fetch(`${ghApiUrl(gh)}?ref=${gh.branch}`, { headers: { Authorization: `Bearer ${gh.token}`, Accept: "application/vnd.github+json" } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Lecture impossible (${res.status})`);
  const j = await res.json();
  return { sha: j.sha, data: JSON.parse(b64DecodeUtf8(j.content.replace(/\n/g, ""))) };
}
async function ghPutFile(gh, dataObj, sha) {
  if (!gh.token) throw new Error("Ajoute ton token d'accès personnel");
  const res = await fetch(ghApiUrl(gh), {
    method: "PUT",
    headers: { Authorization: `Bearer ${gh.token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Carnet — ${new Date().toLocaleString("fr-FR")}`, content: b64EncodeUtf8(JSON.stringify(dataObj, null, 2)), branch: gh.branch, ...(sha ? { sha } : {}) }),
  });
  if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.message || `Échec de l'envoi (${res.status})`); }
}
function countRecords(data) {
  if (!data) return 0;
  let n = 0;
  const months = data.months || {};
  for (const key in months) {
    n += (months[key].expenses || []).length;
    n += (months[key].transfers || []).length;
  }
  for (const p of data.savingsProjects || []) n += (p.contributions || []).length;
  return n;
}
function isRemoteAhead(remoteData, localData) {
  if (!remoteData) return false;
  const remoteCount = countRecords(remoteData);
  const localCount = countRecords(localData);
  if (remoteCount > localCount) return true;
  if (remoteCount === localCount && (remoteData.updatedAt || 0) > (localData.updatedAt || 0)) return true;
  return false;
}
function compareMovements(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  return (b.createdAt || 0) - (a.createdAt || 0);
}
async function ghListVersions(gh, limit) {
  const [owner, repo] = (gh.repo || "").split("/").map((s) => s.trim());
  if (!owner || !repo) throw new Error("Dépôt invalide (attendu utilisateur/depot)");

  const url = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(gh.path)}&sha=${gh.branch}&per_page=${limit || 20}`;

  if (!res.ok) throw new Error(`Historique introuvable (${res.status})`);
  const j = await res.json();
  return j.map((c) => ({ sha: c.sha, date: c.commit?.author?.date, message: c.commit?.message }));
}
async function ghGetFileAtRef(gh, ref) {

/* Excel import (tailored to the "Budget mensuel et annuel" template:      */
/* month tabs Jan..Déc, a "Suivi des dépenses" transaction table, and a    */
/* "Revenus" table per month tab).                                        */
/* ---------------------------------------------------------------------- */

const MONTH_SHEET_NAMES = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Jui", "Aoû", "Sep", "Oct", "Nov", "Déc"];

function xlCellStr(ws, ref) {
  const cell = ws[ref];
  if (!cell) return "";
  const v = cell.w !== undefined ? cell.w : cell.v;
  return v === undefined || v === null ? "" : String(v).trim();
}
function xlCellNum(ws, ref) {
  const cell = ws[ref];
  if (!cell || cell.v === undefined || cell.v === null || cell.v === "") return null;
  const n = typeof cell.v === "number" ? cell.v : parseFloat(String(cell.v).replace(",", "."));
  return isNaN(n) ? null : n;
}
function xlCellDateISO(ws, ref) {
  const cell = ws[ref];
  if (!cell || cell.v === undefined || cell.v === null || cell.v === "") return null;
  let d = cell.v;
  if (!(d instanceof Date)) {
    if (typeof d === "number") d = new Date(Math.round((d - 25569) * 86400 * 1000));
    else return null;
  }
  if (isNaN(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function parseBudgetWorkbook(workbook) {
  const transactions = [];
  const categoryNames = new Set();
  const incomeBySheetMonth = [];
  const creditsBySheetMonth = [];

  MONTH_SHEET_NAMES.forEach((sheetName, monthIndex) => {
    const ws = workbook.Sheets[sheetName];
    if (!ws) return;

    for (let row = 76; row <= 236; row++) {
      const dateISO = xlCellDateISO(ws, `B${row}`);
      const amount = xlCellNum(ws, `D${row}`);
      if (!dateISO || amount === null || amount === 0) continue;
      const catName = xlCellStr(ws, `F${row}`) || "Import Excel";
      const note = xlCellStr(ws, `K${row}`);
      transactions.push({ date: dateISO, amount: Math.abs(amount), kind: amount < 0 ? "reimbursement" : "expense", categoryName: catName, note });
      categoryNames.add(catName);
    }

    let incomeSum = 0, hasIncome = false;
    for (let row = 23; row <= 32; row++) {
      const catName = xlCellStr(ws, `B${row}`);
      if (!catName) continue;
      const actuel = xlCellNum(ws, `F${row}`);
      const prevu = xlCellNum(ws, `D${row}`);
      const val = actuel !== null ? actuel : prevu;
      if (val) { incomeSum += val; hasIncome = true; }
    }
    if (hasIncome) incomeBySheetMonth.push({ monthIndex, amount: incomeSum });

    // Crédits et prêts: manual Prévu/Actuel per category, like Revenus — but
    // treated as a regular expense (facture) rather than as income.
    for (let row = 57; row <= 70; row++) {
      const catName = xlCellStr(ws, `C${row}`);
      if (!catName) continue;
      const actuel = xlCellNum(ws, `F${row}`);
      const prevu = xlCellNum(ws, `D${row}`);
      const val = actuel !== null ? actuel : prevu;
      if (val) { creditsBySheetMonth.push({ monthIndex, categoryName: catName, amount: val }); categoryNames.add(catName); }
    }
  });

  const yearCounts = {};
  transactions.forEach((t) => { const y = t.date.slice(0, 4); yearCounts[y] = (yearCounts[y] || 0) + 1; });
  let year = new Date().getFullYear(), bestCount = 0;
  Object.entries(yearCounts).forEach(([y, c]) => { if (c > bestCount) { bestCount = c; year = parseInt(y, 10); } });

  creditsBySheetMonth.forEach(({ monthIndex, categoryName, amount }) => {
    const date = `${year}-${String(monthIndex + 1).padStart(2, "0")}-01`;
    transactions.push({ date, amount: Math.abs(amount), kind: "expense", categoryName, note: "Crédit / prêt" });
  });

  const monthlyIncome = {};
  incomeBySheetMonth.forEach(({ monthIndex, amount }) => { monthlyIncome[`${year}-${String(monthIndex + 1).padStart(2, "0")}`] = amount; });

  return { transactions, monthlyIncome, categoryNames: Array.from(categoryNames), year };
}

function mergeImportedData(data, parsed) {
  const categories = [...data.categories];
  const nameToId = {};
  categories.forEach((c) => { nameToId[c.name.trim().toLowerCase()] = c.id; });
  let paletteIdx = 0;
  parsed.categoryNames.forEach((name) => {
    const key = name.trim().toLowerCase();
    if (!nameToId[key]) {
      const newCat = { id: uid(), name: name.trim(), color: PALETTE[paletteIdx % PALETTE.length], subcategories: [] };
      paletteIdx++;
      categories.push(newCat);
      nameToId[key] = newCat.id;
    }
  });

  const months = { ...data.months };
  parsed.transactions.forEach((t) => {
    const monthKey = t.date.slice(0, 7);
    const month = months[monthKey] ? { ...months[monthKey], expenses: [...months[monthKey].expenses] } : emptyMonth();
    const categoryId = nameToId[t.categoryName.trim().toLowerCase()];
    month.expenses.push({ id: uid(), amount: t.amount, categoryId, subcategory: "", label: t.note, date: t.date, kind: t.kind, createdAt: Date.now() });
    months[monthKey] = month;
  });

  Object.entries(parsed.monthlyIncome).forEach(([monthKey, amount]) => {
    const month = months[monthKey] || emptyMonth();
    if (!month.income) months[monthKey] = { ...month, income: amount };
  });

  return { ...data, categories, months };
}

function useAppData() {
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get("finance-app-data");
        if (!cancelled) {
          if (res && res.value) setData({ ...DEFAULT_DATA, ...JSON.parse(res.value) });
          else setData(DEFAULT_DATA);
          setReady(true);
        }
      } catch (e) {
        if (!cancelled) { setData(DEFAULT_DATA); setReady(true); }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const persist = useCallback(async (next) => {
    const stamped = { ...next, updatedAt: Date.now() };
    setData(stamped);
    try { await window.storage.set("finance-app-data", JSON.stringify(stamped)); }
    catch (e) { console.error("Erreur de sauvegarde", e); }
  }, []);

  return [data, persist, ready];
}

function applyTheme(themeId) {
  const theme = THEMES.find((t) => t.id === themeId) || THEMES[0];
  const root = document.documentElement;
  Object.entries(theme.vars).forEach(([key, value]) => root.style.setProperty(key, value));
}

/* Budget tab                                                              */
/* ---------------------------------------------------------------------- */

function BudgetTab({ data, updateMonth, mKey, setMKey, categories, addContribution, removeTransfer, updateTransfer, onNeedProject }) {
  const month = getMonth(data, mKey);
  const [showAdd, setShowAdd] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [editIncome, setEditIncome] = useState(false);
  const [incomeDraft, setIncomeDraft] = useState(String(month.income || ""));
  const [editGoal, setEditGoal] = useState(false);
  const [goalDraft, setGoalDraft] = useState(String(month.savingsGoal || ""));

  const totalExpenses = useMemo(() => month.expenses.filter((e) => e.kind !== "reimbursement").reduce((s, e) => s + e.amount, 0), [month.expenses]);
  const totalReimb = useMemo(() => month.expenses.filter((e) => e.kind === "reimbursement").reduce((s, e) => s + e.amount, 0), [month.expenses]);
  const depositsSum = useMemo(() => month.transfers.filter((t) => t.type !== "withdrawal").reduce((s, t) => s + t.amount, 0), [month.transfers]);
  const withdrawalsSum = useMemo(() => month.transfers.filter((t) => t.type === "withdrawal").reduce((s, t) => s + t.amount, 0), [month.transfers]);
  const totalTransfersNet = depositsSum - withdrawalsSum;
  const remaining = (month.income || 0) - totalExpenses + totalReimb - totalTransfersNet;

  const byCategory = useMemo(() => {
    const map = {};
    for (const e of month.expenses) map[e.categoryId] = (map[e.categoryId] || 0) + signedAmount(e);
    const list = categories.map((c) => ({ ...c, total: map[c.id] || 0 })).filter((c) => c.total > 0);
    if (totalTransfersNet > 0) list.push({ id: "_savings", name: "Épargne", color: "#A9803F", total: totalTransfersNet });
    return list.sort((a, b) => b.total - a.total);
  }, [month.expenses, categories, totalTransfersNet]);

  const movements = useMemo(() => {
    const exp = month.expenses.map((e) => ({ ...e, _type: "expense" }));
    const trf = month.transfers.map((t) => ({ ...t, _type: "transfer" }));
    return [...exp, ...trf].sort(compareMovements);
  }, [month.expenses, month.transfers]);

  function saveIncome() {
    const val = parseFloat(incomeDraft.replace(",", ".")) || 0;
    updateMonth(mKey, { ...month, income: val });
    setEditIncome(false);
  }
  function saveGoal() {
    const val = parseFloat(goalDraft.replace(",", ".")) || 0;
    updateMonth(mKey, { ...month, savingsGoal: val });
    setEditGoal(false);
  }
  const savingsGoal = month.savingsGoal || 0;
  const goalPct = savingsGoal > 0 ? (totalTransfersNet / savingsGoal) * 100 : 0;
  const goalReached = savingsGoal > 0 && totalTransfersNet >= savingsGoal;
  function addExpense(exp) { updateMonth(mKey, { ...month, expenses: [...month.expenses, exp] }); }
  function updateExpense(id, patch) { updateMonth(mKey, { ...month, expenses: month.expenses.map((e) => e.id === id ? { ...e, ...patch } : e) }); }
  function removeExpense(item) { updateMonth(mKey, { ...month, expenses: month.expenses.filter((e) => e.id !== item.id) }); }
  function handleDelete(item) { if (item._type === "transfer") removeTransfer(mKey, item.id); else removeExpense(item); }
  function handleEdit(item) { setEditingItem(item); }

  return (
    <div className="tab-panel">
      <MonthSwitcher mKey={mKey} setMKey={setMKey} />
      <div className="hero-card">
        <div className="hero-row">
          <div>
            <div className="hero-label">Revenu du mois</div>
            {editIncome ? (
              <div className="inline-edit">
                <input autoFocus className="inline-input" inputMode="decimal" value={incomeDraft} onChange={(e) => setIncomeDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveIncome()} />
                <button className="icon-btn" onClick={saveIncome}><Check size={16} /></button>
              </div>
            ) : (
              <button className="hero-value-btn" onClick={() => { setIncomeDraft(String(month.income || "")); setEditIncome(true); }}>
                {eur.format(month.income || 0)} <Pencil size={13} />
              </button>
            )}
          </div>
          <div className="hero-divider" />
          <div>
            <div className="hero-label">Reste à vivre</div>
            <div className={`hero-value ${remaining < 0 ? "neg" : ""}`}>{eur.format(remaining)}</div>
          </div>
        </div>
        <div className="hero-sub">Dépensé net ce mois-ci : {eur.format(totalExpenses)}</div>
        {(totalReimb > 0 || depositsSum > 0 || withdrawalsSum > 0) && (
          <div className="hero-sub-chips">
            {totalReimb > 0 && <span className="hero-chip" style={{ color: "var(--chip-green)" }}>+{eur.format(totalReimb)} remboursés</span>}
            {depositsSum > 0 && <span className="hero-chip" style={{ color: "var(--chip-gold)" }}>−{eur.format(depositsSum)} épargnés</span>}
            {withdrawalsSum > 0 && <span className="hero-chip" style={{ color: "var(--chip-green)" }}>+{eur.format(withdrawalsSum)} retirés de l'épargne</span>}
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">Objectif d'épargne</div>
        {editGoal ? (
          <div className="inline-edit" style={{ marginBottom: 10 }}>
            <input autoFocus className="inline-input small" inputMode="decimal" value={goalDraft}
              onChange={(e) => setGoalDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveGoal()} />
            <button className="icon-btn" onClick={saveGoal}><Check size={15} /></button>
          </div>
        ) : (
          <button className="envelope-amount-btn" style={{ marginBottom: 10 }} onClick={() => { setGoalDraft(String(savingsGoal || "")); setEditGoal(true); }}>
            {savingsGoal > 0 ? eur.format(savingsGoal) : "Définir un objectif"} <Pencil size={12} />
          </button>
        )}
        {savingsGoal > 0 ? (
          <>
            <ProgressBar value={goalPct} tone="brass" positiveOverflow />
            <div className="envelope-sub" style={goalReached ? { color: "var(--brass)", fontWeight: 500, marginTop: 6 } : { marginTop: 6 }}>
              {eur.format(Math.max(0, totalTransfersNet))} sur {eur.format(savingsGoal)} ({Math.round(goalPct)} %){goalReached ? " — objectif atteint" : ""}
            </div>
          </>
        ) : (
          <div className="empty-hint">{totalTransfersNet > 0 ? `${eur.format(totalTransfersNet)} épargnés ce mois-ci. ` : ""}Définis un objectif pour suivre ta progression.</div>
        )}
      </div>

      {byCategory.length > 0 && (
        <div className="card">
          <div className="card-title">Répartition</div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <SimplePie data={byCategory} />
            <div className="legend">
              {byCategory.map((c) => (
                <div className="legend-row" key={c.id}>
                  <span className="dot" style={{ background: c.color }} />
                  <span className="legend-name">{c.name}</span>
                  <span className="legend-val">{eur.format(c.total)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">Mouvements</div>
        <div className="hint-line">Touche un mouvement pour le modifier.</div>
        {movements.length === 0 ? (
          <div className="empty-hint">Aucun mouvement ce mois-ci. Ajoute une dépense, un remboursement ou un virement épargne avec le bouton +.</div>
        ) : (
          <ul className="expense-list">
            {movements.map((item) => <MovementRow key={item.id} item={item} cat={categories.find((c) => c.id === item.categoryId)} onDelete={handleDelete} onEdit={handleEdit} />)}
          </ul>
        )}
      </div>

      <button className="fab" onClick={() => setShowAdd(true)} aria-label="Ajouter"><Plus size={22} /></button>

      {(showAdd || (editingItem && editingItem._type !== "transfer")) && (
        <AddEntrySheet
          categories={categories} projects={data.savingsProjects} mKey={mKey} editing={editingItem && editingItem._type !== "transfer" ? editingItem : null}
          onClose={() => { setShowAdd(false); setEditingItem(null); }}
          onSaveExpense={(exp) => { addExpense(exp); setShowAdd(false); }}
          onUpdateExpense={(id, patch) => { updateExpense(id, patch); setEditingItem(null); }}
          onDeleteExpense={(item) => { removeExpense(item); setEditingItem(null); }}
          onSaveContribution={(projectId, contrib) => { addContribution(projectId, contrib); setShowAdd(false); }}
          onNeedProject={() => { setShowAdd(false); onNeedProject(); }}
        />
      )}
      {editingItem && editingItem._type === "transfer" && (
        <EditTransferSheet
          transfer={editingItem}
          onClose={() => setEditingItem(null)}
          onSave={(patch) => { updateTransfer(mKey, editingItem.id, patch); setEditingItem(null); }}
          onDelete={() => { removeTransfer(mKey, editingItem.id); setEditingItem(null); }}
        />
      )}
    </div>
  );
}

function EditTransferSheet({ transfer, onClose, onSave, onDelete }) {
  const [type, setType] = useState(transfer.type || "deposit");
  const [amount, setAmount] = useState(String(transfer.amount));
  const [date, setDate] = useState(transfer.date);
  const [note, setNote] = useState(transfer.note || "");

  function submit() {
    const val = parseFloat(amount.replace(",", "."));
    if (!val || val <= 0) return;
    onSave({ amount: val, date, note, type });
  }

  return (
    <Sheet title={`Modifier « ${transfer.projectName} »`} onClose={onClose}>
      <div className="segmented">
        <button className={type === "deposit" ? "seg-active" : ""} onClick={() => setType("deposit")}>Ajouter</button>
        <button className={type === "withdrawal" ? "seg-active" : ""} onClick={() => setType("withdrawal")}>Retirer</button>
      </div>
      <Field label="Montant"><input className="text-input" inputMode="decimal" autoFocus value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
      <Field label="Date"><input className="text-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Note (optionnel)"><input className="text-input" placeholder={type === "withdrawal" ? "Ex. Achat billets d'avion" : "Ex. Virement mensuel"} value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      <button className="primary-btn" style={{ background: type === "withdrawal" ? "var(--forest)" : "var(--brass)" }} onClick={submit}>Enregistrer les modifications</button>
      <button className="danger-btn ghost" onClick={onDelete}><Trash2 size={14} /> Supprimer ce mouvement</button>
    </Sheet>
  );
}

function AddEntrySheet({ categories, projects, mKey, editing, onClose, onSaveExpense, onUpdateExpense, onDeleteExpense, onSaveContribution, onNeedProject }) {
  const isEditing = !!editing;
  const [kind, setKind] = useState(editing?.kind || "expense");
  const [amount, setAmount] = useState(editing ? String(editing.amount) : "");
  const [categoryId, setCategoryId] = useState(editing?.categoryId || categories[0]?.id || "");
  const [subcategory, setSubcategory] = useState(editing?.subcategory || "");
  const [label, setLabel] = useState(editing?.label || "");
  const [date, setDate] = useState(editing?.date || todayISO());
  const [projectId, setProjectId] = useState(projects[0]?.id || "");
  const subs = categories.find((c) => c.id === categoryId)?.subcategories || [];

  function submit() {
    const val = parseFloat(amount.replace(",", "."));
    if (!val || val <= 0) return;
    if (isEditing) {
      if (!categoryId) return;
      onUpdateExpense(editing.id, { amount: val, categoryId, subcategory, label, date, kind });
      return;
    }
    if (kind === "saving") {
      if (!projectId) return;
      onSaveContribution(projectId, { id: uid(), amount: val, date, note: label });
      return;
    }
    if (!categoryId) return;
    onSaveExpense({ id: uid(), amount: val, categoryId, subcategory, label, date, kind, createdAt: Date.now() });
  }

  return (
    <Sheet title={isEditing ? "Modifier le mouvement" : "Nouveau mouvement"} onClose={onClose}>
      <div className="segmented">
        <button className={kind === "expense" ? "seg-active" : ""} onClick={() => setKind("expense")}>Dépense</button>
        <button className={kind === "reimbursement" ? "seg-active" : ""} onClick={() => setKind("reimbursement")}>Remboursement</button>
        {!isEditing && <button className={kind === "saving" ? "seg-active" : ""} onClick={() => setKind("saving")}>Vers épargne</button>}
      </div>
      <Field label="Montant"><input className="text-input" inputMode="decimal" placeholder="0,00 €" autoFocus value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
      {kind === "saving" && !isEditing ? (
        projects.length === 0 ? (
          <div className="empty-hint">Tu n'as pas encore de projet d'épargne.<button className="ghost-btn small" style={{ marginTop: 10 }} onClick={onNeedProject}>Créer un projet dans l'onglet Épargne</button></div>
        ) : (
          <>
            <Field label="Projet">
              <div className="chip-row">
                {projects.map((p) => <button key={p.id} className={`chip ${projectId === p.id ? "chip-active" : ""}`} style={projectId === p.id ? { background: p.color, borderColor: p.color } : {}} onClick={() => setProjectId(p.id)}>{p.name}</button>)}
              </div>
            </Field>
            <div className="hint-line" style={{ marginTop: -6 }}>Sera déduit du reste à vivre de {monthLabel(mKey)}.</div>
          </>
        )
      ) : (
        <>
          <Field label="Catégorie">
            <div className="chip-row">
              {categories.map((c) => <button key={c.id} className={`chip ${categoryId === c.id ? "chip-active" : ""}`} style={categoryId === c.id ? { background: c.color, borderColor: c.color } : {}} onClick={() => { setCategoryId(c.id); setSubcategory(""); }}>{c.name}</button>)}
            </div>
          </Field>
          {subs.length > 0 && (
            <Field label="Sous-catégorie">
              <div className="chip-row">
                {subs.map((s) => <button key={s} className={`chip ${subcategory === s ? "chip-active-outline" : ""}`} onClick={() => setSubcategory(subcategory === s ? "" : s)}>{s}</button>)}
              </div>
            </Field>
          )}
        </>
      )}
      <Field label={kind === "saving" ? "Note (optionnel)" : "Libellé (optionnel)"}><input className="text-input" placeholder={kind === "reimbursement" ? "Ex. Remboursement CPAM" : "Ex. Courses Monoprix"} value={label} onChange={(e) => setLabel(e.target.value)} /></Field>
      <Field label="Date"><input className="text-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      {!(kind === "saving" && !isEditing && projects.length === 0) && (
        <button className="primary-btn" style={kind === "saving" ? { background: "var(--brass)" } : {}} onClick={submit}>
          {isEditing && "Enregistrer les modifications"}
          {!isEditing && kind === "expense" && "Ajouter la dépense"}
          {!isEditing && kind === "reimbursement" && "Ajouter le remboursement"}
          {!isEditing && kind === "saving" && "Virer vers l'épargne"}
        </button>
      )}
      {isEditing && <button className="danger-btn ghost" onClick={() => onDeleteExpense(editing)}><Trash2 size={14} /> Supprimer ce mouvement</button>}
    </Sheet>
  );
}

function EnvelopesTab({ data, updateMonth, mKey, setMKey, categories, catActions }) {
  const month = getMonth(data, mKey);
  const [editingCat, setEditingCat] = useState(null);
  const [draft, setDraft] = useState("");
  const [showNewCat, setShowNewCat] = useState(false);
  const [detailCat, setDetailCat] = useState(null);

  const spentByCategory = useMemo(() => {
    const map = {};
    for (const e of month.expenses) map[e.categoryId] = (map[e.categoryId] || 0) + signedAmount(e);
    return map;
  }, [month.expenses]);
  const totalAllocated = categories.reduce((s, c) => s + (month.envelopes[c.id] || 0), 0);

  function saveAllocation(catId) {
    const val = parseFloat(draft.replace(",", ".")) || 0;
    updateMonth(mKey, { ...month, envelopes: { ...month.envelopes, [catId]: val } });
    setEditingCat(null);
  }
  function removeExpense(item) { updateMonth(mKey, { ...month, expenses: month.expenses.filter((e) => e.id !== item.id) }); }

  const chartData = categories.map((c) => ({ name: c.name, "Alloué": month.envelopes[c.id] || 0, "Dépensé": Math.max(0, spentByCategory[c.id] || 0) })).filter((d) => d["Alloué"] > 0 || d["Dépensé"] > 0);

  return (
    <div className="tab-panel">
      <MonthSwitcher mKey={mKey} setMKey={setMKey} />
      <div className="hero-card">
        <div className="hero-row">
          <div><div className="hero-label">Alloué au total</div><div className="hero-value">{eur.format(totalAllocated)}</div></div>
          <div className="hero-divider" />
          <div><div className="hero-label">Revenu du mois</div><div className="hero-value">{eur.format(month.income || 0)}</div></div>
        </div>
        <div className="hero-sub">{month.income ? `${eur.format(month.income - totalAllocated)} non alloué` : "Renseigne ton revenu dans l'onglet Budget"}</div>
      </div>

      {chartData.length > 0 && (
        <div className="card">
          <div className="card-title">Alloué vs dépensé</div>
          <SimpleBarChart data={chartData} series={[{ key: "Alloué", color: "var(--line-dark)" }, { key: "Dépensé", color: "var(--forest)" }]} />
        </div>
      )}

        <ul className="envelope-list">
          {categories.map((c) => {
            const allocated = month.envelopes[c.id] || 0;
            const spent = Math.max(0, spentByCategory[c.id] || 0);
            const over = spent > allocated;
            const pct = allocated > 0 ? (spent / allocated) * 100 : (spent > 0 ? 200 : 0);
            return (
              <li className={`envelope-row ${over ? "over" : ""}`} key={c.id}>
                <div className="envelope-top">
                  <button className="envelope-name-btn" onClick={() => setDetailCat(c.id)}>
                    <span className="dot" style={{ background: c.color }} /><span className="envelope-name">{c.name}</span>
                    {over && <AlertTriangle size={13} color="var(--brick)" />}
                  </button>
                  {editingCat === c.id ? (
                    <div className="inline-edit" style={{ marginLeft: "auto" }}>
                      <input autoFocus className="inline-input small" inputMode="decimal" value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveAllocation(c.id)} />

                    </div>
                  ) : (
                    <button className="envelope-amount-btn" onClick={() => { setDraft(String(allocated || "")); setEditingCat(c.id); }}>{eur.format(allocated)} <Pencil size={12} /></button>
                  )}
                </div>
                <ProgressBar value={pct} tone="forest" />
                <div className="envelope-sub" style={over ? { color: "var(--brick)", fontWeight: 500 } : {}}>
                  {over ? `Dépassé de ${eur.format(spent - allocated)}` : `${eur.format(spent)} dépensé${allocated > 0 ? ` · ${eur.format(allocated - spent)} restant` : ""}`}
                </div>
              </li>
            );
          })}
        </ul>
        <button className="ghost-btn" onClick={() => setShowNewCat(true)}><Plus size={15} /> Nouvelle catégorie</button>
      </div>

      {showNewCat && <NewCategorySheet onClose={() => setShowNewCat(false)} onSave={(cat) => { catActions.add(cat); setShowNewCat(false); }} />}
      {detailCat && (
        <CategoryDetailSheet
          category={categories.find((c) => c.id === detailCat)}

    </div>
  );
}

function RecapTab({ data, categories, year, setYear }) {
  const months = useMemo(() => Array.from({ length: 12 }, (_, i) => `${year}-${String(i + 1).padStart(2, "0")}`), [year]);
  const stats = useMemo(() => {
    let income = 0, expenses = 0, reimb = 0, transfers = 0;
    const catMap = {};
    const monthly = months.map((k) => {
      const m = data.months[k];
      if (!m) return 0;
      income += m.income || 0;
      let monthNet = 0;
      for (const e of m.expenses || []) {
        if (e.kind === "reimbursement") { reimb += e.amount; }
        else { expenses += e.amount; monthNet += e.amount; }
        const key = categories.find((c) => c.id === e.categoryId) ? e.categoryId : "_unknown";
        catMap[key] = (catMap[key] || 0) + signedAmount(e);
      }
      for (const t of m.transfers || []) transfers += t.type === "withdrawal" ? -t.amount : t.amount;
      return monthNet;
    });
    return { income, expenses, reimb, transfers, catMap, monthly };
  }, [data.months, months, categories]);

  const categoryBreakdown = useMemo(() => {
    const list = categories.map((c) => ({ ...c, total: stats.catMap[c.id] || 0 })).filter((c) => c.total !== 0);
    if (stats.catMap._unknown) list.push({ id: "_unknown", name: "Catégories supprimées", color: "#999999", total: stats.catMap._unknown });
    return list.sort((a, b) => b.total - a.total);
  }, [categories, stats.catMap]);

  const netSpent = stats.expenses;
  const chartMonthly = months.map((k, i) => ({ name: MONTH_SHORT[i], "Dépensé": Math.max(0, stats.monthly[i]) }));

  return (
    <div className="tab-panel">
      <YearSwitcher year={year} setYear={setYear} />
      <div className="card stat-grid">
        <div className="stat-item"><div className="stat-label">Revenu total</div><div className="stat-value">{eur.format(stats.income)}</div></div>
        <div className="stat-item"><div className="stat-label">Dépensé net</div><div className="stat-value">{eur.format(netSpent)}</div></div>
        <div className="stat-item"><div className="stat-label">Remboursé</div><div className="stat-value" style={{ color: "var(--forest)" }}>{eur.format(stats.reimb)}</div></div>
        <div className="stat-item"><div className="stat-label">Épargné (net)</div><div className="stat-value" style={{ color: "var(--brass)" }}>{eur.format(stats.transfers)}</div></div>
      </div>
      <div className="card">
        <div className="card-title">Dépenses par mois</div>
        <SimpleBarChart data={chartMonthly} series={[{ key: "Dépensé", color: "var(--forest)" }]} />
      </div>
      <div className="card">
        <div className="card-title">Dépenses par catégorie</div>
        {categoryBreakdown.length === 0 ? <div className="empty-hint">Aucune dépense enregistrée sur {year}.</div> : (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 8 }}>
              <SimplePie data={categoryBreakdown.filter((c) => c.total > 0)} />
            </div>
            <ul className="recap-list">
              {categoryBreakdown.map((c) => (
                <li className="recap-row" key={c.id}>
                  <span className="dot" style={{ background: c.color }} />
                  <span className="recap-name">{c.name}</span>
                  <span className="recap-val" style={c.total < 0 ? { color: "var(--forest)" } : {}}>{c.total < 0 ? eur.format(Math.abs(c.total)) : eur.format(c.total)}</span>
                </li>
              ))}
            </ul>
          </>
        )}
      </div>
    </div>
  );
}

function BackupSheet({ data, onClose, onImport, pinHash, onSetPin, onClearPin, gh, updateGh, lastSync }) {
  const fileRef = useRef(null);
  const [importError, setImportError] = useState("");
  const [confirmImport, setConfirmImport] = useState(null);
  const [showLockSetup, setShowLockSetup] = useState(false);
  const [confirmDisableLock, setConfirmDisableLock] = useState(false);
  const [ghStatus, setGhStatus] = useState(null);
  const [confirmOverwrite, setConfirmOverwrite] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [showImportExcel, setShowImportExcel] = useState(false);

  function handleExport() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `carnet-export-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { setConfirmImport(JSON.parse(reader.result)); setImportError(""); } catch (err) { setImportError("Ce fichier n'est pas un export valide."); } };
    reader.readAsText(file);
    e.target.value = "";
  }
  async function doPush(existingSha) {
    setGhStatus({ type: "loading", message: "Envoi en cours…" });
    try {
      await ghPutFile(gh, data, existingSha);
      setGhStatus({ type: "success", message: "Envoyé sur GitHub." });
    } catch (e) { setGhStatus({ type: "error", message: e.message }); }
  }
  async function pushToGithub() {
    setGhStatus({ type: "loading", message: "Vérification…" });
    try {
      const existing = await ghGetFile(gh);
      if (existing && isRemoteAhead(existing.data, data)) {
        setGhStatus(null);
        setConfirmOverwrite({ sha: existing.sha, remoteCount: countRecords(existing.data), localCount: countRecords(data) });
        return;
      }
      await doPush(existing?.sha);
    } catch (e) { setGhStatus({ type: "error", message: e.message }); }
  }
  async function pullFromGithub() {
    setGhStatus({ type: "loading", message: "Récupération en cours…" });
    try {
      const remote = await ghGetFile(gh);
      if (!remote) throw new Error("Fichier introuvable sur GitHub.");
      setConfirmImport(remote.data);
      setGhStatus(null);
    } catch (e) { setGhStatus({ type: "error", message: e.message }); }
  }
  function copyLink() {
    try {
      const [owner, repo] = (gh.repo || "").split("/").map((s) => s.trim());
      if (!owner || !repo) throw new Error("Dépôt invalide");
      const url = `https://raw.githubusercontent.com/${owner}/${repo}/${gh.branch}/${gh.path}`;
      navigator.clipboard?.writeText(url);
      setGhStatus({ type: "success", message: "Lien copié (fonctionne si le dépôt est public)." });
    } catch (e) { setGhStatus({ type: "error", message: e.message }); }
  }

  return (
    <Sheet title="Sauvegarde" onClose={onClose}>
      <div className="empty-hint">Tes données sont déjà enregistrées localement sur cet appareil (stockage du navigateur), indépendamment de toute connexion.</div>
      <button className="primary-btn" onClick={handleExport}><Download size={16} style={{ marginRight: 6, verticalAlign: -3 }} /> Exporter en .json</button>
      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>Importer un fichier</div>
        <button className="ghost-btn" onClick={() => fileRef.current?.click()}><Upload size={15} /> Choisir un fichier .json</button>
        <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleFile} />
        {importError && <div className="danger-text" style={{ marginTop: 8 }}>{importError}</div>}
        <button className="ghost-btn" onClick={() => setShowImportExcel(true)}><Upload size={15} /> Importer depuis Excel (.xlsx)</button>
      </div>
      <div style={{ height: 1, background: "var(--line)", margin: "4px 0" }} />
      <div>
        <div className="field-label" style={{ marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}><Link2 size={13} /> Synchronisation GitHub</div>
        <div className="hint-line" style={{ marginTop: 0, marginBottom: 10 }}>
          Utilise le même dépôt, le même fichier et le même token sur chacun de tes appareils (téléphone, PC…) pour qu'ils partagent les mêmes données. Token à accès restreint (fine-grained, droit « Contents: Read and write » sur ce seul dépôt).
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Field label="Dépôt (utilisateur/depot)"><input className="text-input" placeholder="ex. jdupont/mes-finances" value={gh.repo} onChange={(e) => updateGh({ repo: e.target.value })} /></Field>
          <Field label="Chemin du fichier"><input className="text-input" value={gh.path} onChange={(e) => updateGh({ path: e.target.value })} /></Field>
          <Field label="Branche"><input className="text-input" value={gh.branch} onChange={(e) => updateGh({ branch: e.target.value })} /></Field>
          <Field label="Token d'accès personnel"><input className="text-input" type="password" placeholder="ghp_… ou github_pat_…" value={gh.token} onChange={(e) => updateGh({ token: e.target.value })} /></Field>
        </div>
        <label className="autosync-row">
          <input type="checkbox" checked={!!gh.autoSync} onChange={(e) => updateGh({ autoSync: e.target.checked })} />
          <span>Synchroniser automatiquement à chaque modification</span>
        </label>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <button className="ghost-btn small" style={{ flex: 1, marginTop: 0 }} onClick={pullFromGithub}><RefreshCw size={13} /> Charger</button>
          <button className="primary-btn" style={{ flex: 1, marginTop: 0, padding: 9, fontSize: 13 }} onClick={pushToGithub}><Upload size={13} style={{ marginRight: 4, verticalAlign: -2 }} /> Envoyer</button>
        </div>
        <button className="ghost-btn small" style={{ width: "100%" }} onClick={copyLink}><Copy size={13} /> Copier le lien du fichier</button>
        <button className="ghost-btn small" style={{ width: "100%" }} onClick={() => setShowHistory(true)}><History size={13} /> Restaurer une version précédente</button>
        {lastSync && !ghStatus && <div className={`sync-status ${lastSync.type}`}>{lastSync.message}</div>}
        {ghStatus && <div className={`sync-status ${ghStatus.type}`}>{ghStatus.message}</div>}
        {confirmOverwrite && (
          <div className="danger-zone">
            <div className="danger-text">
              La version sur GitHub contient plus de mouvements ({confirmOverwrite.remoteCount}) que ta version locale ({confirmOverwrite.localCount}). L'écraser quand même ? Astuce : essaie plutôt "Charger" pour récupérer la version la plus complète, ou "Restaurer une version précédente" pour comparer.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="ghost-btn small" style={{ flex: 1 }} onClick={() => setConfirmOverwrite(null)}>Annuler</button>
              <button className="danger-btn" style={{ flex: 1 }} onClick={() => { doPush(confirmOverwrite.sha); setConfirmOverwrite(null); }}>Écraser quand même</button>
            </div>
          </div>
        )}
      </div>
      {confirmImport && (
        <div className="danger-zone">
          <div className="danger-text">Importer ce fichier remplacera toutes tes données actuelles. Continuer ?</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="ghost-btn small" style={{ flex: 1 }} onClick={() => setConfirmImport(null)}>Annuler</button>
            <button className="danger-btn" style={{ flex: 1 }} onClick={() => { onImport(confirmImport); setConfirmImport(null); onClose(); }}>Importer</button>
          </div>
        </div>
      )}
      {showHistory && <RestoreVersionSheet gh={gh} onClose={() => setShowHistory(false)} onPick={(versionData) => { setConfirmImport(versionData); setShowHistory(false); }} />}
      {showImportExcel && <ImportExcelSheet data={data} onClose={() => setShowImportExcel(false)} onImport={onImport} />}

      <div style={{ height: 1, background: "var(--line)", margin: "4px 0" }} />

      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>Verrouillage</div>
        {pinHash ? (
          <>
            <div className="hint-line" style={{ marginTop: 0 }}>Un code PIN protège l'ouverture de l'app sur cet appareil.</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="ghost-btn small" style={{ flex: 1, marginTop: 0 }} onClick={() => setShowLockSetup(true)}>Modifier le code</button>
              <button className="danger-btn" style={{ flex: 1 }} onClick={() => setConfirmDisableLock(true)}>Désactiver</button>
            </div>
            {confirmDisableLock && (
              <div className="danger-zone">
                <div className="danger-text">Désactiver le verrouillage ? N'importe qui ouvrant l'app y aura accès.</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="ghost-btn small" style={{ flex: 1 }} onClick={() => setConfirmDisableLock(false)}>Annuler</button>
                  <button className="danger-btn" style={{ flex: 1 }} onClick={() => { onClearPin(); setConfirmDisableLock(false); }}>Confirmer</button>
                </div>
              </div>
            )}
          </>
        ) : (
          <button className="ghost-btn" onClick={() => setShowLockSetup(true)}>Activer un code PIN</button>
        )}
      </div>
      {showLockSetup && <LockSetupSheet onClose={() => setShowLockSetup(false)} onSet={(hash) => { onSetPin(hash); setShowLockSetup(false); }} />}
    </Sheet>
  );
}

/* Local PIN lock (device-only, never sent anywhere)                       */

function LockSetupSheet({ onClose, onSet }) {
  const [step, setStep] = useState(1);
  const [pin, setPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [error, setError] = useState("");

  function next() {
    if (pin.length < 4) { setError("4 chiffres minimum."); return; }
    setError("");
    setStep(2);
  }
  async function finish() {
    if (confirmPin !== pin) { setError("Les deux codes ne correspondent pas."); setConfirmPin(""); return; }
    const hash = await sha256Hex(pin);
    onSet(hash);
  }

  return (
    <Sheet title="Code PIN" onClose={onClose}>
      <div className="empty-hint">Ce code reste uniquement sur ton téléphone, il n'est jamais envoyé nulle part. Il n'y a pas de récupération : si tu l'oublies, il faudra effacer les données du site dans les réglages Safari pour rentrer à nouveau (tu perdras aussi tes données locales, sauf si tu as un export récent).</div>
      {step === 1 ? (
        <>
          <Field label="Nouveau code (4 à 6 chiffres)">
            <input className="text-input" type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} autoFocus
              style={{ textAlign: "center", fontSize: 22, letterSpacing: 8 }}
              value={pin} onChange={(e) => { setPin(e.target.value.replace(/\D/g, "")); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && next()} />
          </Field>
          {error && <div className="danger-text">{error}</div>}
          <button className="primary-btn" onClick={next}>Continuer</button>
        </>
      ) : (
        <>
          <Field label="Confirme le code">
            <input className="text-input" type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} autoFocus
              style={{ textAlign: "center", fontSize: 22, letterSpacing: 8 }}
              value={confirmPin} onChange={(e) => { setConfirmPin(e.target.value.replace(/\D/g, "")); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && finish()} />
          </Field>
          {error && <div className="danger-text">{error}</div>}
          <button className="primary-btn" onClick={finish}>Activer le verrouillage</button>
        </>
      )}
    </Sheet>
  );
}

function LockScreen({ pinHash, onUnlock }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  async function submit() {
    const h = await sha256Hex(pin);
    if (h === pinHash) onUnlock();
    else { setError(true); setPin(""); }
  }

  return (
    <div className="app-shell" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div style={{ textAlign: "center", padding: 24, width: "100%", maxWidth: 260 }}>
        <div className="wordmark" style={{ marginBottom: 28 }}>Carnet</div>
        <input className="text-input" type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} autoFocus
          style={{ textAlign: "center", fontSize: 26, letterSpacing: 10 }}
          value={pin} onChange={(e) => { setPin(e.target.value.replace(/\D/g, "")); setError(false); }}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
        {error && <div className="danger-text" style={{ marginTop: 10 }}>Code incorrect.</div>}
        <button className="primary-btn" style={{ marginTop: 18 }} onClick={submit}>Déverrouiller</button>
      </div>
    </div>
  );
}

function formatVersionDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function RestoreVersionSheet({ gh, onClose, onPick }) {
  const [versions, setVersions] = useState(null);
  const [error, setError] = useState("");
  const [loadingSha, setLoadingSha] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const list = await ghListVersions(gh, 20);
        setVersions(list);
      } catch (e) { setError(e.message); }
    })();
  }, []);

  async function pick(sha) {
    setLoadingSha(sha);
    try {
      const versionData = await ghGetFileAtRef(gh, sha);
      onPick(versionData);
    } catch (e) { setError(e.message); setLoadingSha(null); }
  }

  return (
    <Sheet title="Versions précédentes" onClose={onClose}>
      <div className="empty-hint">Chaque envoi vers GitHub garde une trace. Choisis un point dans le temps pour prévisualiser puis restaurer.</div>
      {error && <div className="danger-text">{error}</div>}
      {!versions && !error && <div className="empty-hint">Chargement…</div>}
      {versions && versions.length === 0 && <div className="empty-hint">Aucun historique trouvé pour ce fichier.</div>}
      {versions && versions.length > 0 && (
        <ul className="expense-list">
          {versions.map((v, i) => (
            <li className="expense-row" key={v.sha}>
              <div className="expense-click static">
                <div className="expense-main">
                  <div className="expense-label">{formatVersionDate(v.date)}{i === 0 && <span className="pill">Actuelle</span>}</div>
                  <div className="expense-meta">{v.message}</div>
                </div>
              </div>
              <button className="ghost-btn small" style={{ marginTop: 0, width: "auto", padding: "7px 12px" }} disabled={loadingSha === v.sha} onClick={() => pick(v.sha)}>
                {loadingSha === v.sha ? "…" : "Voir"}
              </button>
            </li>
          ))}
        </ul>
      )}
    </Sheet>
  );
}

function ImportExcelSheet({ data, onClose, onImport }) {
  const fileRef = useRef(null);
  const [status, setStatus] = useState(null);
  const [preview, setPreview] = useState(null);

  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setStatus({ type: "loading", message: "Lecture du fichier…" });
    setPreview(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type: "array", cellDates: true });
        const parsed = parseBudgetWorkbook(wb);
        if (parsed.transactions.length === 0 && Object.keys(parsed.monthlyIncome).length === 0) {
          setStatus({ type: "error", message: "Aucune donnée trouvée. Vérifie qu'il s'agit bien du modèle « Budget mensuel et annuel », avec des dépenses saisies dans le tableau « Suivi des dépenses » d'au moins un onglet mensuel." });
          return;
        }
        const merged = mergeImportedData(data, parsed);
        setPreview({ parsed, merged, newCatCount: merged.categories.length - data.categories.length });
        setStatus(null);
      } catch (err) {
        setStatus({ type: "error", message: "Impossible de lire ce fichier : " + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  const monthCount = preview ? new Set(preview.parsed.transactions.map((t) => t.date.slice(0, 7))).size : 0;
  const incomeMonthCount = preview ? Object.keys(preview.parsed.monthlyIncome).length : 0;

  return (
    <Sheet title="Importer depuis Excel" onClose={onClose}>
      <div className="empty-hint">
        Conçu pour le modèle « Budget mensuel et annuel » (onglets Jan à Déc). Récupère les dépenses et remboursements du tableau « Suivi des dépenses » de chaque onglet, le revenu total renseigné, et les crédits/prêts (importés comme des dépenses catégorisées). Les prévisionnels (Prévu) et les projets d'épargne du fichier ne sont pas importés dans cette version.
      </div>
      <button className="ghost-btn" onClick={() => fileRef.current?.click()}><Upload size={15} /> Choisir un fichier .xlsx</button>
      <input ref={fileRef} type="file" accept=".xlsx" style={{ display: "none" }} onChange={handleFile} />
      {status && <div className={`sync-status ${status.type}`}>{status.message}</div>}
      {preview && (
        <div className="danger-zone">
          <div className="danger-text" style={{ color: "var(--forest)" }}>
            {preview.parsed.transactions.length} mouvement(s) trouvé(s) sur {monthCount} mois (année {preview.parsed.year}).
            {preview.newCatCount > 0 && ` ${preview.newCatCount} nouvelle(s) catégorie(s) seront créées.`}
            {incomeMonthCount > 0 && ` Revenu détecté sur ${incomeMonthCount} mois.`}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="ghost-btn small" style={{ flex: 1 }} onClick={() => setPreview(null)}>Annuler</button>
            <button className="danger-btn" style={{ flex: 1, background: "var(--forest)" }} onClick={() => { onImport(preview.merged); onClose(); }}>Importer</button>
          </div>
        </div>
      )}
    </Sheet>
  );
}

function App({ pinHash, onSetPin, onClearPin }) {
  const [data, persist, ready] = useAppData();
  const [tab, setTab] = useState("budget");
  const [mKey, setMKey] = useState(monthKey(new Date()));
  const [year, setYear] = useState(new Date().getFullYear());
  const [showBackup, setShowBackup] = useState(false);
  const [showTheme, setShowTheme] = useState(false);
  const [theme, setThemeState] = useState("carnet");

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("app-theme");
        const id = res && res.value ? res.value : "carnet";
        setThemeState(id);
        applyTheme(id);
      } catch (e) { applyTheme("carnet"); }
    })();
  }, []);
  function pickTheme(id) {
    setThemeState(id);
    applyTheme(id);
    window.storage.set("app-theme", id).catch(() => {});
  }

  const [gh, setGhState] = useState(null);
  const [lastSync, setLastSync] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("github-sync-config");
        setGhState(res && res.value ? { token: "", repo: "", path: "carnet-data.json", branch: "main", autoSync: false, ...JSON.parse(res.value) } : { token: "", repo: "", path: "carnet-data.json", branch: "main", autoSync: false });
      } catch (e) {
        setGhState({ token: "", repo: "", path: "carnet-data.json", branch: "main", autoSync: false });
      }
    })();
  }, []);
  const updateGh = useCallback((patch) => {
    setGhState((g) => {
      const next = { ...(g || {}), ...patch };
      window.storage.set("github-sync-config", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }, []);

  // Auto-push to GitHub a few seconds after each change, if enabled and configured.
  // If GitHub turns out to be ahead (e.g. another device synced in the meantime),
  // load that newer version instead of push, automatically, no confirmation needed.
  const firstRun = useRef(true);
  const pushTimer = useRef(null);
  useEffect(() => {
    if (firstRun.current) { firstRun.current = false; return; }
    if (!data || !gh || !gh.autoSync || !gh.token || !gh.repo) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(async () => {
      try {
        const existing = await ghGetFile(gh).catch(() => null);
        if (existing && isRemoteAhead(existing.data, data)) {
          persist(existing.data);
          setLastSync({ type: "success", message: `Version plus récente chargée depuis GitHub à ${new Date().toLocaleTimeString("fr-FR")}` });
          return;
        }
        await ghPutFile(gh, data, existing?.sha);
        setLastSync({ type: "success", message: `Synchronisé à ${new Date().toLocaleTimeString("fr-FR")}` });
      } catch (e) {
        setLastSync({ type: "error", message: `Échec de la synchro auto : ${e.message}` });
      }
    }, 4000);
    return () => { if (pushTimer.current) clearTimeout(pushTimer.current); };
  }, [data, gh]);

  // Check for a newer version on GitHub when the app opens or comes back to the
  // foreground, and load it automatically — no confirmation needed.
  useEffect(() => {
    if (!gh || !gh.token || !gh.repo || !data) return;
    let cancelled = false;
    async function check() {
      try {
        const remote = await ghGetFile(gh);
        if (!cancelled && isRemoteAhead(remote?.data, data)) {
          persist(remote.data);
          setLastSync({ type: "success", message: `Version plus récente chargée depuis GitHub à ${new Date().toLocaleTimeString("fr-FR")}` });
        }
      } catch (e) { /* silent: manual Charger button remains available */ }
    }
    check();
    function onVis() { if (document.visibilityState === "visible") check(); }
    document.addEventListener("visibilitychange", onVis);
    return () => { cancelled = true; document.removeEventListener("visibilitychange", onVis); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gh, data?.updatedAt]);

  const updateMonth = useCallback((key, monthData) => { if (!data) return; persist({ ...data, months: { ...data.months, [key]: monthData } }); }, [data, persist]);
  const catActions = {
    add: useCallback((cat) => { if (!data) return; persist({ ...data, categories: [...data.categories, cat] }); }, [data, persist]),
    remove: useCallback((catId) => { if (!data) return; persist({ ...data, categories: data.categories.filter((c) => c.id !== catId) }); }, [data, persist]),
    addSub: useCallback((catId, name) => { if (!data) return; persist({ ...data, categories: data.categories.map((c) => c.id === catId ? { ...c, subcategories: [...c.subcategories, name] } : c) }); }, [data, persist]),
    removeSub: useCallback((catId, name) => { if (!data) return; persist({ ...data, categories: data.categories.map((c) => c.id === catId ? { ...c, subcategories: c.subcategories.filter((s) => s !== name) } : c) }); }, [data, persist]),
  };
  const addProject = useCallback((p) => { if (!data) return; persist({ ...data, savingsProjects: [...data.savingsProjects, p] }); }, [data, persist]);
  const removeProject = useCallback((id) => { if (!data) return; persist({ ...data, savingsProjects: data.savingsProjects.filter((p) => p.id !== id) }); }, [data, persist]);
  const addContribution = useCallback((projectId, contrib) => {
    if (!data) return;
    const project = data.savingsProjects.find((p) => p.id === projectId);
    const month = getMonth(data, mKey);
    const type = contrib.type || "deposit";
    const record = { id: contrib.id, amount: contrib.amount, date: contrib.date, note: contrib.note, type, monthKey: mKey, createdAt: contrib.createdAt || Date.now() };
    const transfer = { id: contrib.id, amount: contrib.amount, date: contrib.date, note: contrib.note, type, projectId, projectName: project?.name || "Projet", createdAt: contrib.createdAt || Date.now() };
    persist({ ...data, months: { ...data.months, [mKey]: { ...month, transfers: [...month.transfers, transfer] } }, savingsProjects: data.savingsProjects.map((p) => p.id === projectId ? { ...p, contributions: [...p.contributions, record] } : p) });
  }, [data, persist, mKey]);
  const removeTransfer = useCallback((key, transferId) => {
    if (!data || !key) return;
    const month = getMonth(data, key);
    const transfer = month.transfers.find((t) => t.id === transferId);
    if (!transfer) return;
    persist({ ...data, months: { ...data.months, [key]: { ...month, transfers: month.transfers.filter((t) => t.id !== transferId) } }, savingsProjects: data.savingsProjects.map((p) => p.id === transfer.projectId ? { ...p, contributions: p.contributions.filter((c) => c.id !== transferId) } : p) });
  }, [data, persist]);
  const updateTransfer = useCallback((key, transferId, patch) => {
    if (!data || !key) return;
    const month = getMonth(data, key);
    const transfer = month.transfers.find((t) => t.id === transferId);
    if (!transfer) return;
    const newMonth = { ...month, transfers: month.transfers.map((t) => t.id === transferId ? { ...t, ...patch } : t) };
    const newProjects = data.savingsProjects.map((p) => p.id === transfer.projectId ? { ...p, contributions: p.contributions.map((c) => c.id === transferId ? { ...c, ...patch } : c) } : p);
    persist({ ...data, months: { ...data.months, [key]: newMonth }, savingsProjects: newProjects });
  }, [data, persist]);
  const handleImport = useCallback((imported) => { persist({ ...DEFAULT_DATA, ...imported }); }, [persist]);

  if (!ready || !data || !gh) return <div className="app-shell"><div className="loading">Chargement…</div></div>;

  return (
    <div className="app-shell">
      <header className="app-header">
        <span className="wordmark">Carnet</span>
        <div style={{ display: "flex", gap: 4 }}>
          <button className="icon-btn" onClick={() => setShowTheme(true)} aria-label="Thème"><Palette size={19} /></button>
          <button className="icon-btn" onClick={() => setShowBackup(true)} aria-label="Sauvegarde"><Settings size={19} /></button>
        </div>
      </header>
      <main className="app-main">
        {tab === "budget" && <BudgetTab data={data} updateMonth={updateMonth} mKey={mKey} setMKey={setMKey} categories={data.categories} addContribution={addContribution} removeTransfer={removeTransfer} updateTransfer={updateTransfer} onNeedProject={() => setTab("epargne")} />}
        {tab === "enveloppes" && <EnvelopesTab data={data} updateMonth={updateMonth} mKey={mKey} setMKey={setMKey} categories={data.categories} catActions={catActions} />}
        {tab === "epargne" && <SavingsTab projects={data.savingsProjects} addProject={addProject} addContribution={addContribution} removeProject={removeProject} removeTransfer={removeTransfer} mKey={mKey} />}
        {tab === "recap" && <RecapTab data={data} categories={data.categories} year={year} setYear={setYear} />}
      </main>
      <nav className="tab-bar">
        <button className={`tab-btn ${tab === "budget" ? "active" : ""}`} onClick={() => setTab("budget")}><Wallet size={19} /><span>Budget</span></button>
        <button className={`tab-btn ${tab === "enveloppes" ? "active" : ""}`} onClick={() => setTab("enveloppes")}><Target size={19} /><span>Enveloppes</span></button>
        <button className={`tab-btn ${tab === "epargne" ? "active" : ""}`} onClick={() => setTab("epargne")}><PiggyBank size={19} /><span>Épargne</span></button>
        <button className={`tab-btn ${tab === "recap" ? "active" : ""}`} onClick={() => setTab("recap")}><BarChart3 size={19} /><span>Récap</span></button>
      </nav>
      {showBackup && <BackupSheet data={data} onClose={() => setShowBackup(false)} onImport={handleImport} pinHash={pinHash} onSetPin={onSetPin} onClearPin={onClearPin} gh={gh} updateGh={updateGh} lastSync={lastSync} />}
      {showTheme && <ThemeSheet theme={theme} onPick={pickTheme} onClose={() => setShowTheme(false)} />}
    </div>
  );
}

function Root() {
  const [pinHash, setPinHashState] = useState(undefined); // undefined = loading, null = no PIN set
  const [locked, setLocked] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("app-pin-hash");
        const hash = res ? res.value : null;
        setPinHashState(hash);
        setLocked(!!hash);
      } catch (e) { setPinHashState(null); setLocked(false); }
    })();
  }, []);

  useEffect(() => {
    function onVisibilityChange() {
      if (document.visibilityState === "hidden" && pinHash) setLocked(true);
    }
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => document.removeEventListener("visibilitychange", onVisibilityChange);
  }, [pinHash]);

  async function onSetPin(hash) {
    await window.storage.set("app-pin-hash", hash);
    setPinHashState(hash);
    setLocked(false);
  }
  async function onClearPin() {
    await window.storage.delete("app-pin-hash");
    setPinHashState(null);
  }

  if (pinHash === undefined) return <div className="app-shell"><div className="loading">Chargement…</div></div>;
  if (locked && pinHash) return <LockScreen pinHash={pinHash} onUnlock={() => setLocked(false)} />;

  return <App pinHash={pinHash} onSetPin={onSetPin} onClearPin={onClearPin} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
